plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

def formatMinecraftSupportLabel = { String supportRange ->
	def normalizedRange = supportRange.trim()
	if (normalizedRange.contains('-')) {
		return normalizedRange.split('-', 2).collect { it.trim().replaceAll(/(?i)\.x\b/, '.X') }.join('-')
	}
	return normalizedRange.replaceAll(/(?i)\.x\b/, '.X')
}

def buildArchiveName = "${project.archives_base_name}-fabric-${formatMinecraftSupportLabel(project.minecraft_support_range)}"

version = project.mod_version
group = project.maven_group

base {
	archivesName = buildArchiveName
}

repositories {
	maven { url "https://maven.shedaniel.me/" }
	maven { url "https://maven.terraformersmc.com/" }
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"reachcrafting" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	// 26.3 dev clients died at random with exit 0xC0000005 and no hs_err
	// (2026-09-16, five crash dumps). A Java worker's 32 KB stack probe
	// skips Windows' single guard page; HotSpot repairs that by re-committing
	// the stack, which strips PAGE_GUARD, so the OS can no longer grow that
	// thread's stack and a later jvm!__chkstk walks off the committed part.
	// Pre-touching every Java thread stack at creation sidesteps the whole
	// chain. Dev-only: players launch through Mojang's launcher.
	def stackPretouchArgs = ["-XX:+UnlockDiagnosticVMOptions", "-XX:+AlwaysPreTouchStacks"]

	// Temporary run config for the server packet-limit investigation:
	// auto-joins the localhost Paper repro server as a fixed offline user.
	runs {
		client {
			vmArgs(stackPretouchArgs as String[])
		}
		clientRepro {
			client()
			vmArgs(stackPretouchArgs as String[])
			configName = "Repro Client (localhost Paper)"
			def reproPort = project.hasProperty("ecServerPort") ? project.property("ecServerPort") : "25565"
			programArgs("--username", "ReproBot", "--quickPlayMultiplayer", "localhost:${reproPort}")
			// The automated launch scripts pass -PecReproQuiet to opt into the
			// non-intrusive dev client (no focus steal / taskbar flash, free
			// cursor). A plain `gradlew runClientRepro` you run by hand leaves
			// it unset -> normal focused window + grabbed mouse, so you can
			// play as ReproBot; F6 still toggles the free cursor live.
			//
			// NB: this MUST be a project property (-P), not an env var: Gradle's
			// System.getenv() reads the long-lived DAEMON's environment, so a
			// reused daemon silently ignores a per-launch env var. -P is
			// per-invocation and daemon-safe. (Env var kept only as a fallback.)
			if (project.hasProperty("ecReproQuiet") || System.getenv("EC_REPRO_QUIET") != null) {
				vmArgs("-Dreachcrafting.repro.quiet=true")
			}
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Optional compile/runtime integrations for config UI support.
	compileOnly "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}"
	runtimeOnly "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}"
	compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
	runtimeOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
}

processResources {
	inputs.property "version", project.version
	inputs.property "minecraft_support_range", project.minecraft_support_range

	filesMatching("fabric.mod.json") {
		expand(
			"version": inputs.properties.version,
			"minecraft_support_range": inputs.properties.minecraft_support_range
		)
	}
}

tasks.withType(JavaCompile).configureEach {
	options.release = 25
}

java {
	withSourcesJar()
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

jar {
	inputs.property "archivesName", project.base.archivesName
	archiveVersion = "v${project.version}"

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

tasks.named("sourcesJar") {
	archiveVersion = "v${project.version}"
}

tasks.matching { it.name == "remapJar" }.configureEach {
	archiveVersion = "v${project.version}"
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = buildArchiveName
			from components.java
		}
	}

	repositories {
	}
}
